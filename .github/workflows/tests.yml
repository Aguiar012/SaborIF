name: Testes

on:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: teste-local
          POSTGRES_DB: saborif_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:teste-local@localhost:5432/saborif_test
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Instalar dependencias Python
        run: pip install requests beautifulsoup4 psycopg[binary]

      - name: Testar pedidos
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q sistema_pedido tests

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias Node.js
        run: npm ci --ignore-scripts

      - name: Testar bot do WhatsApp
        run: |
          node --check whatsapp/bot/logica_respostas.js
          node --check whatsapp/bot/refeicoes.js
          node --test tests/refeicoes_bot.test.js
